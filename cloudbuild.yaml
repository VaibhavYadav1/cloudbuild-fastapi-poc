steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/python-repo/my-app:$BUILD_ID'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/python-repo/my-app:latest'
      - '.'

# 2. Automatically push and register the images when the build succeeds
images:
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/python-repo/my-app:$BUILD_ID'
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/python-repo/my-app:latest'

# 3. Fixes the "build.service_account ... logs_bucket" error
options:
  logging: CLOUD_LOGGING_ONLY
